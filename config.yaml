# BikeAIv4 Configuration

# Data paths
raw_dir: "data/raw"
processed_dir: "data/processed"
augmented_dir: "data/augmented"

# Audio settings
audio:
  sample_rate: 16000
  duration: 1.0
  overlap: 0.5

augmentation:
  prob_background: 0.0    # Skip aug on background
  prob_minority: 0.8      # Higher for grinder/tools
  techniques:             # Existing: noise, stretch, pitch, gain
    noise_snr_range: [15, 30]
    stretch_range: [0.95, 1.05]
    pitch_semitones: [-1, 1]
    gain_range: [0.8, 1.2]

# Preprocessing
preprocessing:
  normalize: "peak"
  target_db: -1.0
  highpass_cutoff: 80

# Feature extraction
features:
  classical:
    n_mfcc: 13
    n_fft: 2048
    hop_length: 512
  neural:
    n_mels: 40
    n_fft: 2048
    hop_length: 512

# Training
training:
  test_size: 0.2
  val_size: 0.1
  random_state: 42

# Model settings
models:
  classical_dir: "models/classical"
  neural_dir: "models/neural"
  optimized_dir: "models/optimized"
  deployment_dir: "models/deployment"

# Results
results:
  figures_dir: "results/figures"
  metrics_dir: "results/metrics"
  reports_dir: "results/reports"
